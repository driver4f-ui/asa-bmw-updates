name: Publish verified ASA BMW v1.10.11 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-bmw-v11011.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-06dc-8210-a91a-35542ff5a142/raw?se=2026-11-22T18%3A29%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=494ff3df-ba48-54bd-ac39-5395b3e4ea73&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T04%3A13%3A45Z&ske=2026-11-23T04%3A13%3A45Z&sks=b&skv=2026-06-06&sig=qdAA9zsKX3OoGuXdH51nHbjs2KUN6GZes8V9Wvsn%2BT4%3D"
      BUNDLE_SHA256: "8e87ef4edc9e00d6751c85afc4292a625e8931b728a95bb8bda6c22c6806c212"
    steps:
      - name: Retrieve and verify tested Windows installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 --max-time 240 "$ARTIFACT_URL" -o artifact.zip
          echo "$BUNDLE_SHA256  artifact.zip" | sha256sum -c -
          mkdir -p release
          unzip -q artifact.zip -d release
          cd release
          sha256sum -c ASA-BMW-Setup-v1.10.11.exe.sha256
          sha256sum -c ASA_BMW_v1.10.11_WINDOWS_UPDATE.zip.sha256
          test "$(head -c 2 ASA-BMW-Setup-v1.10.11.exe)" = "MZ"
          test "$(unzip -Z1 ASA_BMW_v1.10.11_WINDOWS_UPDATE.zip)" = "ASA-AUTO-SERVICE-Ryznar.exe"
          test "$(stat -c%s ASA-BMW-Setup-v1.10.11.exe)" -ge 1000000
      - name: Publish signed-checksum Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          cat > notes.txt <<'NOTES'
          ASA Książka Serwisowa BMW v1.10.11

          - Poprawiono okno „Co nowego”: przycisk OK jest zawsze widoczny na dole.
          - Długi opis zmian przewija się osobno i nie przesłania przycisku.
          - Okno można zamknąć przez OK, Enter, Esc lub przycisk X.
          - Potwierdzenie wyświetlenia zmian zapisywane jest dla danej wersji.
          - Błąd zapisu potwierdzenia nie uniemożliwia zamknięcia okna.
          - Test GUI: 2000 wierszy opisu, przycisk OK jest widoczny i zamyka okno.
          - Pełny instalator Windows z weryfikacją SHA-256 oraz ZIP dla starszych aktualizatorów.
          - Testy Windows: kompilacja, instalacja, aktualizacja i ponowna instalacja — PASS.
          NOTES
          gh release create v1.10.11 \
            ASA-BMW-Setup-v1.10.11.exe \
            ASA-BMW-Setup-v1.10.11.exe.sha256 \
            ASA_BMW_v1.10.11_WINDOWS_UPDATE.zip \
            ASA_BMW_v1.10.11_WINDOWS_UPDATE.zip.sha256 \
            --repo driver4f-ui/asa-bmw-updates \
            --title 'ASA Książka Serwisowa BMW v1.10.11' \
            --notes-file notes.txt --latest
          gh api repos/driver4f-ui/asa-bmw-updates/releases/latest --jq '.tag_name' | grep -Fx v1.10.11
