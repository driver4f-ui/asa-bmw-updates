name: Publish ASA BMW v1.10.6 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-v1106.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: driver4f-ui/asa-bmw-updates
      GH_TOKEN: ${{ github.token }}
      ASSET_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-1040-81f4-aa4c-570bc9e149ce/raw?se=2026-11-21T09%3A59%3A10Z&sp=r&sv=2026-06-06&sr=b&scid=0a8d90ea-67a5-54d8-97b3-1d4ce473ee51&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T05%3A11%3A35Z&ske=2026-11-22T05%3A11%3A35Z&sks=b&skv=2026-06-06&sig=Xahz56LJcLhPxNq/3adBpUpbeBVXeRw0xoFNYvSYeQs%3D"
    steps:
      - name: Download and verify ASA BMW Windows package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 240 "$ASSET_URL" -o artifact.zip
          echo 'c3a61e95dd0f18320c71108b46305eed743a546b3e47d5d0e256b6dea4a2274a  artifact.zip' | sha256sum -c -
          unzip -p artifact.zip ASA_BMW_v1.10.6_WINDOWS_UPDATE.zip > ASA_BMW_v1.10.6_WINDOWS_UPDATE.zip
          echo '667b74f2e3a617b3dfc3d6e8e23e5ec09f38d92c4aee8d72348f82a8404c4251  ASA_BMW_v1.10.6_WINDOWS_UPDATE.zip' | sha256sum -c -
          gh release create v1.10.6 ASA_BMW_v1.10.6_WINDOWS_UPDATE.zip \
            --title 'ASA BMW v1.10.6' \
            --notes 'Kolejnosc zapisu zostala przeniesiona obok Zaznacz wszystko nad tabela historii. Dwie opcje zastapiono lista wyboru. Ustawienia i zapis HU zachowane. Testy aplikacji oraz kompilacja i instalacja Windows zakonczone sukcesem.' \
            --latest
