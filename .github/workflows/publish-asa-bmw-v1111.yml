name: Publish verified ASA BMW v1.11.1 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-bmw-v1111.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-16f8-8210-87a9-4faa29a90593/raw?se=2026-11-22T19%3A08%3A05Z&sp=r&sv=2026-06-06&sr=b&scid=01132f64-0dd7-5b85-a402-9ecf4b85421b&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T03%3A29%3A40Z&ske=2026-11-23T03%3A29%3A40Z&sks=b&skv=2026-06-06&sig=YylkPSBCToJFRkaItxizQeP9CT86E%2B464n0dzby1bec%3D"
      BUNDLE_SHA256: "cdee49c76b4eccaebd632bfbc9bc0e4a9cf0bebfd71bb483dc9d18815c37f972"
    steps:
      - name: Retrieve and verify tested Windows installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 --max-time 240 "$ARTIFACT_URL" -o artifact.zip
          echo "$BUNDLE_SHA256  artifact.zip" | sha256sum -c -
          mkdir -p release
          unzip -q artifact.zip -d release
          cd release
          sha256sum -c ASA-BMW-Setup-v1.11.1.exe.sha256
          sha256sum -c ASA_BMW_v1.11.1_WINDOWS_UPDATE.zip.sha256
          test "$(head -c 2 ASA-BMW-Setup-v1.11.1.exe)" = "MZ"
          test "$(unzip -Z1 ASA_BMW_v1.11.1_WINDOWS_UPDATE.zip)" = "ASA-AUTO-SERVICE-Ryznar.exe"
          test "$(stat -c%s ASA-BMW-Setup-v1.11.1.exe)" -ge 1000000
      - name: Publish verified Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          cat > notes.txt <<'NOTES'
          ASA Książka Serwisowa BMW v1.11.1

          - Naprawiono jasne paski przewijania w nowym ciemnogranatowym wyglądzie.
          - Wszystkie suwaki mają ciemny tor i grafitowo-niebieski uchwyt bez jasnych strzałek i obramowań.
          - Przy najechaniu i przeciąganiu suwak delikatnie rozjaśnia się na niebiesko.
          - Poprawiono paski pionowe i poziome w historii, edytorze, importerze AOS, ustawieniach i oknach pomocniczych.
          - Zmieniono również podstawowy motyw ttk dla nowych okien.
          - Nie zmieniono odczytu i zapisu HU, danych serwisowych ani formatów plików.
          - Pełna kopia wersji v1.11.0 jest dostępna w prywatnym repozytorium kodu w katalogu kopie/.
          - Instalator Windows z kontrolami SHA-256 i zgodna paczka ZIP dla starszych wersji.
          - Testy Windows: unittest, build EXE, instalacja i ponowna instalacja PASS.
          NOTES
          gh release create v1.11.1 \
            ASA-BMW-Setup-v1.11.1.exe \
            ASA-BMW-Setup-v1.11.1.exe.sha256 \
            ASA_BMW_v1.11.1_WINDOWS_UPDATE.zip \
            ASA_BMW_v1.11.1_WINDOWS_UPDATE.zip.sha256 \
            --repo driver4f-ui/asa-bmw-updates \
            --title 'ASA Książka Serwisowa BMW v1.11.1' \
            --notes-file notes.txt --latest
          gh api repos/driver4f-ui/asa-bmw-updates/releases/latest --jq '.tag_name' | grep -Fx v1.11.1
