name: Publish verified ASA BMW v1.11.3 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-bmw-v1113.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-de48-81f4-9ed8-0bc740210f00/raw?se=2026-11-22T19%3A29%3A08Z&sp=r&sv=2026-06-06&sr=b&scid=3286d195-a5ff-5d98-9221-42b2eb127e4d&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T04%3A29%3A12Z&ske=2026-11-23T04%3A29%3A12Z&sks=b&skv=2026-06-06&sig=9z1Rb%2BLLbdgPTvXoaK6SIGs7TX5Qr6XJZj7fQ1hNWZQ%3D"
      BUNDLE_SHA256: "5593ae37dbbc35552d66c4127260a16dab9c44ce7ad6335032d305a920fa4321"
    steps:
      - name: Download and verify tested Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 --max-time 240 "$ARTIFACT_URL" -o artifact.zip
          echo "$BUNDLE_SHA256  artifact.zip" | sha256sum -c -
          mkdir -p release
          unzip -q artifact.zip -d release
          cd release
          sha256sum -c ASA-BMW-Setup-v1.11.3.exe.sha256
          sha256sum -c ASA_BMW_v1.11.3_WINDOWS_UPDATE.zip.sha256
          test "$(head -c 2 ASA-BMW-Setup-v1.11.3.exe)" = "MZ"
          test "$(unzip -Z1 ASA_BMW_v1.11.3_WINDOWS_UPDATE.zip)" = "ASA-AUTO-SERVICE-Ryznar.exe"
          test "$(stat -c%s ASA-BMW-Setup-v1.11.3.exe)" -ge 1000000
      - name: Publish verified update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          cat > notes.txt <<'NOTES'
          ASA Książka Serwisowa BMW v1.11.3

          - Dodano przycisk AKTUALIZACJA w lewym menu, bezpośrednio pod IMPORT Z BMW AOS.
          - Nowy przycisk ręcznie sprawdza GitHub i pokazuje wynik; nowa wersja otwiera istniejące okno zgody na pobranie i instalację.
          - Na pasku tytułowym Windows widnieje ASA Książka Serwisowa BMW — v1.11.3.
          - Zachowano automatyczne sprawdzanie aktualizacji, komunikację ENET/ICOM, historię serwisową i zabezpieczenia HU.
          - Pełna kopia poprzedniego stanu v1.11.2 pozostaje w gałęzi backup prywatnego repozytorium.
          - Testy Windows: unittest (w tym nowy test przycisku), budowa EXE, instalacja i ponowna instalacja — PASS.
          NOTES
          gh release create v1.11.3 \
            ASA-BMW-Setup-v1.11.3.exe \
            ASA-BMW-Setup-v1.11.3.exe.sha256 \
            ASA_BMW_v1.11.3_WINDOWS_UPDATE.zip \
            ASA_BMW_v1.11.3_WINDOWS_UPDATE.zip.sha256 \
            --repo driver4f-ui/asa-bmw-updates \
            --title 'ASA Książka Serwisowa BMW v1.11.3' \
            --notes-file notes.txt --latest
          gh api repos/driver4f-ui/asa-bmw-updates/releases/latest --jq '.tag_name' | grep -Fx v1.11.3
