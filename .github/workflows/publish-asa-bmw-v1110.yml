name: Publish verified ASA BMW v1.11.0 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-bmw-v1110.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-a230-81f4-b579-d29b0a4ab1eb/raw?se=2026-11-22T18%3A56%3A39Z&sp=r&sv=2026-06-06&sr=b&scid=e637f048-7a07-522b-b69c-3f52d2895082&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T07%3A19%3A19Z&ske=2026-11-23T07%3A19%3A19Z&sks=b&skv=2026-06-06&sig=%2BmoDIu9txIeWQtQgWwax9zre6kNGjg/PelpkkZhz9GM%3D"
      BUNDLE_SHA256: "67351a7c288dc474029ae9d91e27347c9c9b1b2fd3ea5f65cab0a7d52dcaf368"
    steps:
      - name: Retrieve and verify tested Windows installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 --max-time 240 "$ARTIFACT_URL" -o artifact.zip
          echo "$BUNDLE_SHA256  artifact.zip" | sha256sum -c -
          mkdir -p release
          unzip -q artifact.zip -d release
          cd release
          sha256sum -c ASA-BMW-Setup-v1.11.0.exe.sha256
          sha256sum -c ASA_BMW_v1.11.0_WINDOWS_UPDATE.zip.sha256
          test "$(head -c 2 ASA-BMW-Setup-v1.11.0.exe)" = "MZ"
          test "$(unzip -Z1 ASA_BMW_v1.11.0_WINDOWS_UPDATE.zip)" = "ASA-AUTO-SERVICE-Ryznar.exe"
          test "$(stat -c%s ASA-BMW-Setup-v1.11.0.exe)" -ge 1000000
      - name: Publish verified Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          cat > notes.txt <<'NOTES'
          ASA Książka Serwisowa BMW v1.11.0

          - Całkowicie przeprojektowany, elegancki ciemnogranatowy interfejs z niebieskimi akcentami.
          - Karta pojazdu pokazuje VIN, rzeczywisty stan połączenia i zweryfikowany przebieg.
          - Jeden pasek głównych akcji: odczyt książki, import AOS, dodaj wpis i zapis do HU.
          - Nowa tabela historii i panel szczegółów wybranego wpisu z listą czynności.
          - Zachowano zaznaczanie wielu wpisów i wybór kolejności zapisu obok siebie.
          - Import BMW AOS dostępny także bezpośrednio z lewego menu.
          - Rzadziej używane operacje PRG są schowane pod Więcej operacji.
          - Nie zmieniono procedur HU, weryfikacji VIN, ochrony zapisu ani formatu danych.
          - Pełna kopia źródeł wersji 1.10.11 w prywatnym repozytorium ASA, katalog kopie/.
          - Instalator Windows i zgodny ze starszymi wersjami pakiet ZIP, oba z SHA-256.
          - Testy Windows: unittest, budowanie EXE, instalacja i ponowna instalacja — PASS.
          NOTES
          gh release create v1.11.0 \
            ASA-BMW-Setup-v1.11.0.exe \
            ASA-BMW-Setup-v1.11.0.exe.sha256 \
            ASA_BMW_v1.11.0_WINDOWS_UPDATE.zip \
            ASA_BMW_v1.11.0_WINDOWS_UPDATE.zip.sha256 \
            --repo driver4f-ui/asa-bmw-updates \
            --title 'ASA Książka Serwisowa BMW v1.11.0' \
            --notes-file notes.txt --latest
          gh api repos/driver4f-ui/asa-bmw-updates/releases/latest --jq '.tag_name' | grep -Fx v1.11.0
