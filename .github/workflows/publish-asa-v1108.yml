name: Publish ASA BMW v1.10.8 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-v1108.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: driver4f-ui/asa-bmw-updates
      GH_TOKEN: ${{ github.token }}
      ASSET_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-e64c-81f4-8f6f-68f96bce9be6/raw?se=2026-11-21T11%3A00%3A39Z&sp=r&sv=2026-06-06&sr=b&scid=6ac3bee7-a85e-57ac-a8a9-c84b439c506b&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T05%3A13%3A45Z&ske=2026-11-22T05%3A13%3A45Z&sks=b&skv=2026-06-06&sig=MuJ4MtTa7B6NUKI5NtECPqNoEuGUpF8d%2B0O/pC%2BAhYQ%3D"
    steps:
      - name: Download and verify ASA BMW v1.10.8 Windows EXE release package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 240 "$ASSET_URL" -o artifact.zip
          echo '7258a5ef71b7c2b2472cc7c493b116d50a90bd5714fc49a01b03d55a4e704879  artifact.zip' | sha256sum -c -
          unzip -p artifact.zip ASA_BMW_v1.10.8_WINDOWS_UPDATE.zip > ASA_BMW_v1.10.8_WINDOWS_UPDATE.zip
          echo '6aef74fec3ebb436e769f29988585cb582170605f01de13b40ff420ec02bd47a  ASA_BMW_v1.10.8_WINDOWS_UPDATE.zip' | sha256sum -c -
          gh release create v1.10.8 ASA_BMW_v1.10.8_WINDOWS_UPDATE.zip \
            --title 'ASA BMW v1.10.8 — test aktualizacji' \
            --notes 'Wydanie testowe pozwalajace sprawdzic okno pobierania z procentami, weryfikacje, instalacje i automatyczny restart z ASA BMW v1.10.7. Bez zmian w funkcjonalnosci BMW. Wszystkie testy Windows i rollback zakonczone sukcesem.' \
            --latest
