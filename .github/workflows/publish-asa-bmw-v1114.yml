name: Publish verified ASA BMW v1.11.4 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-bmw-v1114.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-bccc-8210-bfad-197f382c2a98/raw?se=2026-11-22T19%3A44%3A13Z&sp=r&sv=2026-06-06&sr=b&scid=6b868883-8759-59a7-98a7-b9d7435c1f47&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T04%3A13%3A46Z&ske=2026-11-23T04%3A13%3A46Z&sks=b&skv=2026-06-06&sig=RsKWTRXiuRA9rOdxfk%2BHOXQSgCqWeq6gRYfgDo7/%2BfE%3D"
      BUNDLE_SHA256: "ca34687aabd1bc93779817cb440942ac12d0c905de38cef7d7eecbc5431c9712"
    steps:
      - name: Retrieve and verify tested Windows installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 --max-time 240 "$ARTIFACT_URL" -o artifact.zip
          echo "$BUNDLE_SHA256  artifact.zip" | sha256sum -c -
          mkdir -p release
          unzip -q artifact.zip -d release
          cd release
          sha256sum -c ASA-BMW-Setup-v1.11.4.exe.sha256
          sha256sum -c ASA_BMW_v1.11.4_WINDOWS_UPDATE.zip.sha256
          test "$(head -c 2 ASA-BMW-Setup-v1.11.4.exe)" = "MZ"
          test "$(unzip -Z1 ASA_BMW_v1.11.4_WINDOWS_UPDATE.zip)" = "ASA-AUTO-SERVICE-Ryznar.exe"
          test "$(stat -c%s ASA-BMW-Setup-v1.11.4.exe)" -ge 1000000
      - name: Publish verified voltage monitor release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          cat > notes.txt <<'NOTES'
          ASA Książka Serwisowa BMW v1.11.4

          - Dodano wskaźnik napięcia 12 V w prawym górnym rogu obok VIN.
          - Po potwierdzeniu połączenia z autem następuje automatyczny odczyt UDS 22 58 15 z DME 0x12 przez ENET/ICOM, co około 4 sekundy.
          - Bez potwierdzonego połączenia widnieje czerwone 0,0 V.
          - Nieobsługiwany na danym BMW DID wyświetla Brak odczytu — nigdy zmyślone wartości.
          - Gdy odczyt przestaje działać, program sprawdza VIN po UDS, a po potwierdzonej utracie łączności czyści sesję i pokazuje czerwone 0,0 V.
          - Pomiary wstrzymywane są podczas innych operacji HU, zapisu i aktualizacji.
          - Funkcja nie zapisuje niczego w ECU i nie oznacza stanu naładowania IBS.
          - Zachowano pełną kopię v1.11.3 sprzed zmian w gałęzi backup.
          - Testy Windows: wszystkie jednostkowe oraz testy GUI; build, instalacja, ponowna instalacja i smoke test — PASS.
          - Działanie na konkretnym BMW wymaga próby na pojeździe — DID nie jest uniwersalny.
          NOTES
          gh release create v1.11.4 \
            ASA-BMW-Setup-v1.11.4.exe \
            ASA-BMW-Setup-v1.11.4.exe.sha256 \
            ASA_BMW_v1.11.4_WINDOWS_UPDATE.zip \
            ASA_BMW_v1.11.4_WINDOWS_UPDATE.zip.sha256 \
            --repo driver4f-ui/asa-bmw-updates \
            --title 'ASA Książka Serwisowa BMW v1.11.4' \
            --notes-file notes.txt --latest
          gh api repos/driver4f-ui/asa-bmw-updates/releases/latest --jq '.tag_name' | grep -Fx v1.11.4
