name: Publish verified ASA BMW v1.11.2 (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-asa-bmw-v1112.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f1dc-8210-92a5-0d45fa004ce3/raw?se=2026-11-22T19%3A21%3A05Z&sp=r&sv=2026-06-06&sr=b&scid=de2fba33-6383-591f-8f57-3bdbb1d8f7bc&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T07%3A19%3A23Z&ske=2026-11-23T07%3A19%3A23Z&sks=b&skv=2026-06-06&sig=aEkD%2BCy6WH4Pb1iu%2BZn7iteF9DhsSfx%2Bkj%2BoK4gIZi8%3D"
      BUNDLE_SHA256: "ed4591ceaca83c6b2cb66d7b4407d4a135b2c6e6ea76d8746df20d568576acf5"
    steps:
      - name: Download and verify tested Windows installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 --max-time 240 "$ARTIFACT_URL" -o artifact.zip
          echo "$BUNDLE_SHA256  artifact.zip" | sha256sum -c -
          mkdir -p release
          unzip -q artifact.zip -d release
          cd release
          sha256sum -c ASA-BMW-Setup-v1.11.2.exe.sha256
          sha256sum -c ASA_BMW_v1.11.2_WINDOWS_UPDATE.zip.sha256
          test "$(head -c 2 ASA-BMW-Setup-v1.11.2.exe)" = "MZ"
          test "$(unzip -Z1 ASA_BMW_v1.11.2_WINDOWS_UPDATE.zip)" = "ASA-AUTO-SERVICE-Ryznar.exe"
          test "$(stat -c%s ASA-BMW-Setup-v1.11.2.exe)" -ge 1000000
      - name: Publish clean Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          cat > notes.txt <<'NOTES'
          ASA Książka Serwisowa BMW v1.11.2

          - Uporządkowano repozytorium kodu: usunięto zagnieżdżone kopie wcześniejszych kopii, zbędne stare raporty i zrzuty ekranów.
          - Pełne poprzednie wydania zachowano na osobnych gałęziach backup z indeksem kopie/README.md.
          - Instalator Windows zawiera tylko niezbędną aplikację EXE, biblioteki _internal i aktualny opis zmian CO_NOWEGO.txt.
          - Usuwa niepotrzebny plik O_PROGRAMIE.txt z wcześniejszych instalacji.
          - Dodatkowe testy chronią przed dołączeniem źródeł, logów, starszych archiwów i innych niepotrzebnych plików.
          - Dodano .gitignore dla plików tymczasowych i wydań.
          - Zachowano import AOS, komunikację ENET/ICOM, zapis historii do HU oraz aktualizator bez zmian.
          - Testy Windows: pełne unittest, build EXE, instalacja, ponowna instalacja i test aktualizacji — PASS.
          NOTES
          gh release create v1.11.2 \
            ASA-BMW-Setup-v1.11.2.exe \
            ASA-BMW-Setup-v1.11.2.exe.sha256 \
            ASA_BMW_v1.11.2_WINDOWS_UPDATE.zip \
            ASA_BMW_v1.11.2_WINDOWS_UPDATE.zip.sha256 \
            --repo driver4f-ui/asa-bmw-updates \
            --title 'ASA Książka Serwisowa BMW v1.11.2' \
            --notes-file notes.txt --latest
          gh api repos/driver4f-ui/asa-bmw-updates/releases/latest --jq '.tag_name' | grep -Fx v1.11.2
